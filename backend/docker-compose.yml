services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rota_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-rotatravada}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Em desenvolvimento, descomente para acessar o banco do host:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rota_user} -d ${POSTGRES_DB:-rotatravada}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rota_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rotatravada}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      ROUTE_INGEST_API_KEY: ${ROUTE_INGEST_API_KEY:?defina ROUTE_INGEST_API_KEY no .env}
      DEFAULT_DEVIATION_TOLERANCE_M: ${DEFAULT_DEVIATION_TOLERANCE_M:-150}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
    ports:
      # Em produção, mantenha só no loopback e coloque o Nginx na frente:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
