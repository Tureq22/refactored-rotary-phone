services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rota_user
      POSTGRES_PASSWORD: senha_segura
      POSTGRES_DB: rotatravada
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rota_user -d rotatravada"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://rota_user:senha_segura@db:5432/rotatravada
      JWT_SECRET: troque-por-uma-chave-longa
      ROUTE_INGEST_API_KEY: chave-do-webhook-troque
      DEFAULT_DEVIATION_TOLERANCE_M: "150"
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  pgdata:
